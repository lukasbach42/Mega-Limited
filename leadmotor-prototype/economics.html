<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mega – leadøkonomi</title><style>body{font:16px system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f6f6f6}main{background:white;padding:24px;border-radius:14px}label{display:block;margin:15px 0}input{width:110px;padding:8px;float:right}output{font-size:25px;font-weight:700}small{color:#555}</style><main><h1>Leadøkonomi – intern beregner</h1><p>Ændr antagelserne. Alle tal er scenarier, ikke dokumenterede resultater.</p><label>Gennemsnitlig årspræmie (kr.) <input id="premium" type="number" value="10000" min="0"></label><label>Partnerprovision (%) <input id="partner" type="number" value="25" step=".1"></label><label>Sælgerprovision (%) <input id="seller" type="number" value="17.71" step=".01"></label><label>Kontaktgrad (%) <input id="contact" type="number" value="60" step="1"></label><label>Salgsrate blandt kontaktede (%) <input id="close" type="number" value="21" step="1"></label><label>Forventet clawback pr. police (kr.) <input id="clawback" type="number" value="0"></label><label>Andre variable omkostninger pr. police (kr.) <input id="other" type="number" value="0"></label><label>Ønsket dækningsbidrag pr. police (kr.) <input id="target" type="number" value="500"></label><hr><p>Break-even CPL: <output id="be"></output></p><p>Maks. CPL med DB-mål: <output id="max"></output></p><p>DB før leadpris pr. police: <output id="db"></output></p><small>Ingen data sendes eller gemmes. Sælgerprocenten er baseret på tidligere provisionsrapport, ikke en fremtidig partneraftale.</small></main><script>const ids=['premium','partner','seller','contact','close','clawback','other','target'];function calc(){const n=id=>Number(document.getElementById(id).value)||0;const gross=n('premium')*(n('partner')-n('seller'))/100-n('clawback')-n('other');const conversion=Math.min(1,Math.max(0,n('contact')/100))*Math.min(1,Math.max(0,n('close')/100));const money=x=>new Intl.NumberFormat('da-DK',{style:'currency',currency:'DKK',maximumFractionDigits:0}).format(x);document.getElementById('be').textContent=money(Math.max(0,gross*conversion));document.getElementById('max').textContent=money(Math.max(0,(gross-n('target'))*conversion));document.getElementById('db').textContent=money(gross)}ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));calc()</script></html>
