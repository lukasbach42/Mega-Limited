<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tak for din booking | Mega Limited</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--bg:#f5f3ee;--card:#fff;--ink:#151515;--muted:#66625b;--line:#ddd8ce;--shadow:0 18px 50px rgba(0,0,0,.08)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:38px;box-shadow:var(--shadow);text-align:center}
    .mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:#e8f2ec;font-size:28px}
    h1{font-size:clamp(34px,7vw,50px);line-height:1.05;letter-spacing:-.04em;margin:0 0 14px}
    p{margin:0 auto;color:var(--muted);font-size:18px;max-width:500px}
    a{display:inline-block;margin-top:28px;color:var(--ink);font-weight:800;text-decoration:none;border-bottom:1px solid var(--ink)}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✓</div>
    <h1>Tak for din booking</h1>
    <p>Din forespørgsel er sendt til Mega Limited. Vi ringer dig op på det tidspunkt, du har valgt.</p>
    <a href="https://megalimited.dk/">Tilbage til Mega Limited</a>
  </main>
</body>
</html>
