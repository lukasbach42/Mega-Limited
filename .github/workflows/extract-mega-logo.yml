name: Extract Mega logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current Mega logo from homepage
        shell: python
        run: |
          from pathlib import Path
          import re, base64
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<img class="brand"[^>]*src="data:image/png;base64,([^"]+)"', html, re.I|re.S)
          if not m:
              raise SystemExit('Could not find embedded Mega logo in current homepage')
          Path('assets').mkdir(exist_ok=True)
          Path('assets/mega-logo.png').write_bytes(base64.b64decode(m.group(1)))
      - name: Commit logo asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mega-logo.png
          git commit -m "Add Mega logo asset"
          git push
