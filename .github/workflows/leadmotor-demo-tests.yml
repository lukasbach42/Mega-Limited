name: Leadmotor synthetic prototype tests
on:
  pull_request:
    paths:
      - "leadmotor-prototype/**"
      - ".github/workflows/leadmotor-demo-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run synthetic-only tests
        run: node --test leadmotor-prototype/*.test.mjs
