name: Remove exact running photo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-running-photo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove exact running-photo panel
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          pattern = r'\s*<div class="culture-panel culture-image">\s*<img\b[^>]*alt="Løb og aktiv livsstil i Mega-universet"[^>]*>\s*</div>'
          updated, count = re.subn(pattern, '', html, count=1, flags=re.I|re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one running-photo panel, found {count}. No site change made.')
          path.write_text(updated, encoding='utf-8')
      - name: Commit site change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove running photo from homepage"
          git push
