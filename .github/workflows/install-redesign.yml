name: Install redesigned homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install redesigned homepage
        shell: python
        run: |
          from pathlib import Path
          import re, base64, gzip
          old = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<img class="brand"[^>]+src="data:image/png;base64,([A-Za-z0-9+/=]+)"', old)
          if m:
              Path('assets').mkdir(exist_ok=True)
              Path('assets/mega-logo.png').write_bytes(base64.b64decode(m.group(1)))
          data = ''
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(data)))
          p = Path('assets/mega-hero-office.jpg')
          if p.exists(): p.unlink()
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git commit -m "Redesign Mega Limited homepage" || exit 0
          git push
