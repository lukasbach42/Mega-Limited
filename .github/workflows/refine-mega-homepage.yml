name: Refine Mega homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine existing Mega design safely
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Keep the existing brand/logo/content. Remove only the old running lifestyle panel if present.
          html = re.sub(
              r'\s*<div class="culture-panel culture-image">\s*<img\b[^>]*alt="Løb og aktiv livsstil i Mega-universet"[^>]*>\s*</div>',
              '', html, count=1, flags=re.I|re.S
          )

          marker = 'id="mega-premium-refinement"'
          if marker not in html:
              css = r'''<style id="mega-premium-refinement">
              :root{--mega-ink:#0b0b0b;--mega-paper:#f4f0e7;--mega-soft:#e8e1d5;--mega-line:rgba(11,11,11,.18)}
              html{scroll-behavior:smooth}
              body{background:var(--mega-paper)!important;color:var(--mega-ink)!important;-webkit-font-smoothing:antialiased}
              .shell{max-width:1320px!important;width:min(1320px,calc(100% - 48px))!important;margin-left:auto!important;margin-right:auto!important}
              .site-header{position:sticky!important;top:0!important;z-index:999!important;background:rgba(244,240,231,.92)!important;backdrop-filter:blur(14px)!important;border-bottom:1px solid var(--mega-line)!important;box-shadow:none!important}
              .site-header .brand img{width:164px!important;height:auto!important}
              .site-header nav{gap:30px!important}
              .site-header nav a{font-size:12px!important;font-weight:800!important;letter-spacing:.08em!important;text-transform:uppercase!important}
              .site-header .nav-contact{background:var(--mega-ink)!important;color:var(--mega-paper)!important;border:1px solid var(--mega-ink)!important;padding:12px 16px!important}
              .hero{min-height:78vh!important;border-bottom:1px solid var(--mega-line)!important;background:#111!important}
              .hero-image{filter:saturate(.72) contrast(1.05)!important;transform:scale(1.01)}
              .hero-shade{background:linear-gradient(90deg,rgba(7,7,7,.82) 0%,rgba(7,7,7,.56) 42%,rgba(7,7,7,.14) 76%,rgba(7,7,7,.05) 100%)!important}
              .hero-copy{max-width:780px!important}
              .hero-copy h1{font-size:clamp(62px,8.4vw,132px)!important;line-height:.82!important;letter-spacing:-.06em!important;margin-bottom:24px!important}
              .hero-copy h1 span{font-family:Georgia,'Times New Roman',serif!important;font-style:italic!important;font-weight:400!important;letter-spacing:-.045em!important}
              .hero-copy .lead{max-width:650px!important;font-size:clamp(17px,1.6vw,22px)!important;line-height:1.45!important;color:rgba(255,255,255,.84)!important}
              .eyebrow{font-size:11px!important;letter-spacing:.18em!important;font-weight:900!important}
              .principles{background:var(--mega-ink)!important;color:var(--mega-paper)!important;border:0!important;padding-top:17px!important;padding-bottom:17px!important}
              .principles span{font-size:13px!important;letter-spacing:.14em!important;font-weight:900!important}
              .story,.values,.community,.gear{padding-top:120px!important;padding-bottom:120px!important}
              .story,.values,.community,.gear{border-bottom:1px solid var(--mega-line)!important}
              .story h2,.values h2,.community h2,.gear h2,.contact h2{font-size:clamp(48px,6.6vw,92px)!important;line-height:.88!important;letter-spacing:-.055em!important}
              .story h2 span,.values h2 span,.gear h2 span{font-family:Georgia,'Times New Roman',serif!important;font-style:italic!important;font-weight:400!important;text-transform:none!important}
              .story-copy p,.community-copy p,.gear-copy p{font-size:17px!important;line-height:1.65!important;color:#514d46!important}
              .story-photo,.community-photo{overflow:hidden!important;background:#ddd6ca!important}
              .story-photo img,.community-photo img{filter:saturate(.72) contrast(1.04)!important;transition:transform .7s ease!important}
              .story-photo:hover img,.community-photo:hover img{transform:scale(1.025)!important}
              .culture{grid-template-columns:1fr!important;gap:0!important}
              .culture-panel:not(.culture-image){min-height:390px!important;background:var(--mega-ink)!important;color:var(--mega-paper)!important;padding:52px!important;display:flex!important;flex-direction:column!important;justify-content:flex-end!important}
              .culture-panel:not(.culture-image) p{max-width:720px!important;color:rgba(244,240,231,.78)!important;font-size:18px!important;line-height:1.6!important}
              .culture-panel .script{font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(30px,4vw,56px)!important;font-style:italic!important;color:var(--mega-paper)!important;margin-top:30px!important}
              .values{background:#fff!important}
              .value-card,.values article{border-color:var(--mega-line)!important;box-shadow:none!important;border-radius:0!important}
              .community{background:var(--mega-paper)!important}
              .community .quote{font-family:Georgia,'Times New Roman',serif!important;font-style:italic!important;font-size:clamp(25px,3vw,40px)!important;line-height:1.2!important}
              .gear{background:#e8e1d5!important}
              .button,.nav-contact{border-radius:0!important;transition:transform .2s ease,background .2s ease,color .2s ease!important}
              .button:hover,.nav-contact:hover{transform:translateY(-2px)!important}
              .contact{background:var(--mega-ink)!important;color:var(--mega-paper)!important;padding-top:110px!important;padding-bottom:90px!important}
              .contact .eyebrow,.contact p,.contact a{color:var(--mega-paper)!important}
              .contact-lead{color:rgba(244,240,231,.7)!important;max-width:650px!important;line-height:1.55!important}
              footer{background:var(--mega-ink)!important;color:var(--mega-paper)!important;border-top:1px solid rgba(244,240,231,.2)!important}
              footer a{color:var(--mega-paper)!important}
              .footer-logo img{filter:invert(1)!important;opacity:.94!important}
              @media(max-width:900px){
                .shell{width:min(100% - 28px,1320px)!important}
                .site-header{padding-left:14px!important;padding-right:14px!important}
                .site-header .brand img{width:138px!important}
                .site-header nav a:not(.nav-contact){display:none!important}
                .hero{min-height:72vh!important}
                .hero-copy h1{font-size:clamp(54px,16vw,86px)!important}
                .story,.values,.community,.gear{padding-top:78px!important;padding-bottom:78px!important}
                .culture-panel:not(.culture-image){min-height:330px!important;padding:28px!important}
                .contact{padding-top:78px!important;padding-bottom:64px!important}
              }
              </style>'''
              html = html.replace('</head>', css + '\n</head>', 1)

          path.write_text(html, encoding='utf-8')

          # Remove temporary helper assets created during previous attempts; they are not used by the site.
          for rel in [
              'assets/mega-logo.webp','assets/mega-logo-v2.webp','assets/README-logo.txt',
              'assets/ignore-me.txt','assets/.keep','assets/mega-logo.webp.bak'
          ]:
              p=Path(rel)
              if p.exists(): p.unlink()
      - name: Commit refined homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine Mega homepage within original brand"
          git push
