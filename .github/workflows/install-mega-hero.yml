name: Install Mega hero image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image and update homepage hero
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -sSfL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lukasbach42/Mega-Limited/git/blobs/046ee90083c344d2dc8406485b54804679398b5b" \
            | python -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > assets/mega-hero-office.jpg
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          pattern = r'(<img\b(?=[^>]*class=["\'][^"\']*hero-image[^"\']*["\'])[^>]*\bsrc=["\'])[^"\']*(["\'][^>]*>)'
          updated, count = re.subn(pattern, r'\1assets/mega-hero-office.jpg\2', html, count=1, flags=re.I|re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one hero image, found {count}.')
          p.write_text(updated, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/mega-hero-office.jpg
          git commit -m "Use new Mega office image on homepage"
          git push
