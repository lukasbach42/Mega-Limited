name: Remove running image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-running-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove only the Mega Gear running image
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          marker = '<div class="gear-image-wrap">'
          start = html.find(marker)
          if start == -1:
              raise SystemExit("Running-image wrapper not found. No website changes made.")

          end = html.find('</div>', start)
          if end == -1:
              raise SystemExit("Closing tag for running-image wrapper not found. No website changes made.")
          end += len('</div>')

          updated = html[:start] + html[end:]
          path.write_text(updated, encoding="utf-8")

      - name: Commit website change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove running image from Mega Gear section"
          git push
